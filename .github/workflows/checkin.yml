name: WorkBuddy Daily Checkin

on:
  schedule:
    # 北京时间每天 09:10（GitHub 用 UTC，需减 8 小时）
    - cron: "10 1 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checkin
        id: checkin
        run: |
          python checkin.py | tee checkin_result.json
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_USER_ID: ${{ secrets.WORKBUDDY_USER_ID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}

      - name: Push result
        if: always()
        run: |
          cat checkin_result.json | python push.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
